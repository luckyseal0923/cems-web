<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台北醫學大學-醫學模擬教育中心</title>
  <script>
    const hash = location.hash;
    const authQuery = new URLSearchParams(location.search);
    const authHash = new URLSearchParams(hash.slice(1));
    if (authQuery.has('code') || authQuery.has('error') || authHash.has('access_token') || authHash.has('error')) {
      location.replace('./service.html' + location.search + hash);
    } else {
      location.replace('./tc/');
    }
  </script>
</head>
<body>
  <a href="./tc/">進入醫學模擬教育中心</a>
  <a href="./en/">English</a>
</body>
</html>
